name: Android Release

on:
  push:
    branches:
      - master

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The generated Firebase config files are gitignored, so CI restores
      # them from secrets. Nothing here needs the firebase/flutterfire CLIs.
      - name: Restore Firebase config
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          echo '${{ secrets.FIREBASE_OPTIONS_DART }}' > lib/firebase_options.dart

      - name: Restore signing keystore
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Firestore rules suite. --legacy-peer-deps is required:
      # @firebase/rules-unit-testing@3 declares a peer of firebase@^10 while
      # the suite runs against firebase@12.
      - name: Install Firestore rules test deps
        run: npm --prefix tools/rules-test ci --legacy-peer-deps

      - name: Run Firestore rules tests
        run: >
          npx --yes firebase-tools emulators:exec
          --only firestore --project liferpg-rules-test
          "npm --prefix tools/rules-test test"

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: Distribute to testers
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFERPG_F3BAB }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
