name: Android Release

on:
  push:
    branches:
      - master

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: setup-java-17
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The generated Firebase config files are gitignored, so CI restores
      # them from secrets. Nothing here needs the firebase/flutterfire CLIs.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks" > android/key.properties
          printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS" >> android/key.properties
          printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD" >> android/key.properties

      # pubspec.yaml's version is `<version>+<build>` (e.g. 1.0.0+1); tags
      # and releases use it verbatim, prefixed with v. Bump it before pushing
      # to master, or the "Create GitHub Release" step will fail on a
      # duplicate tag.
      - name: Extract app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Firestore rules suite. --legacy-peer-deps is required:
      # @firebase/rules-unit-testing@3 declares a peer of firebase@^10 while
      # the suite runs against firebase@12.
      - name: Install Firestore rules test deps
        run: npm --prefix tools/rules-test ci --legacy-peer-deps

      # firebase-tools' emulator runtime requires JDK 21+, but the Android/Flutter
      # build steps need JDK 17 (see checker-qual gotcha in CLAUDE.md), so swap
      # JAVA_HOME to 21 only for this step and restore it right after.
      - uses: actions/setup-java@v4
        id: setup-java-21
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: >
          npx --yes firebase-tools@15 emulators:exec
          --only firestore --project liferpg-rules-test
          "npm --prefix tools/rules-test test"

      - name: Restore JDK 17 for Flutter/Gradle build
        run: echo "JAVA_HOME=${{ steps.setup-java-17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: >
          flutter build apk --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID

      # Runs before Firebase distribution so a Firebase upload failure
      # doesn't prevent the release from being published.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Distribute to testers
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFERPG_F3BAB }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
