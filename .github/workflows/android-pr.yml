name: Android CI

on:
  pull_request:

jobs:
  analyze_test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: setup-java-17
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The generated Firebase config files are gitignored, so CI restores
      # them from secrets. Nothing here needs the firebase/flutterfire CLIs.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Firestore rules suite. --legacy-peer-deps is required:
      # @firebase/rules-unit-testing@3 declares a peer of firebase@^10 while
      # the suite runs against firebase@12.
      - name: Install Firestore rules test deps
        run: npm --prefix tools/rules-test ci --legacy-peer-deps

      # firebase-tools' emulator runtime requires JDK 21+, but the Android/Flutter
      # build steps need JDK 17 (see checker-qual gotcha in CLAUDE.md), so swap
      # JAVA_HOME to 21 only for this step and restore it right after.
      - uses: actions/setup-java@v4
        id: setup-java-21
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: >
          npx --yes firebase-tools@15 emulators:exec
          --only firestore --project liferpg-rules-test
          "npm --prefix tools/rules-test test"

      - name: Restore JDK 17 for Flutter/Gradle build
        run: echo "JAVA_HOME=${{ steps.setup-java-17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: >
          flutter build apk --debug
          --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID

      - uses: actions/upload-artifact@v4
        with:
          name: liferpg-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
